name: Publish Docker image

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest

    steps:
      # 发布镜像前先在干净环境执行构建校验、单测和依赖安全检查。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build validation
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest

    steps:
      # 使用触发工作流的 tag 对应版本构建镜像。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Hub settings
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_REPOSITORY" || { echo "Missing repository variable: DOCKERHUB_REPOSITORY"; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing secret: DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing secret: DOCKERHUB_TOKEN"; exit 1; }
          case "$DOCKERHUB_REPOSITORY" in
            */*) ;;
            *) echo "DOCKERHUB_REPOSITORY must use the form username/repository"; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
