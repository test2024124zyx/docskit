name: Validate project

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate documentation
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Run tests and coverage thresholds
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  container:
    name: Validate production container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag docskit-ci .
      - name: Start read-only production container
        run: docker run --detach --read-only --tmpfs /tmp --init --name docskit-smoke docskit-ci
      - name: Verify readiness and runtime resources
        shell: bash
        run: |
          # 在镜像内验证真实运行链路，不向宿主机公开端口。
          for attempt in $(seq 1 30); do
            if docker exec docskit-smoke node -e "fetch('http://127.0.0.1:3000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            if [ "$attempt" = "30" ]; then exit 1; fi
            sleep 1
          done
          docker exec docskit-smoke node -e "const assert = require('node:assert/strict'); (async () => { for (const route of ['/', '/api/bootstrap', '/script.js', '/search-core.js', '/client-search.js', '/client-navigation.js', '/document-view.js', '/client-api.js', '/client-api-renderer.js', '/client-api-snippets.js', '/client-api-view.js', '/vendor/highlight.min.js', '/vendor/api-renderer.js', '/vendor/swagger-ui-bundle.js', '/vendor/swagger-ui.css', '/vendor/oauth2-redirect.html', '/vendor/oauth2-redirect.js', '/llms.txt', '/llms-full.txt', '/skills/install.md', '/docskit-doc-writing.zip']) { const response = await fetch('http://127.0.0.1:3000' + route); assert.equal(response.status, 200, route); assert.ok((await response.arrayBuffer()).byteLength > 0, route); } })().catch(error => { console.error(error); process.exit(1); });"
      - name: Verify graceful shutdown
        run: |
          docker stop --time 10 docskit-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' docskit-smoke)" = "0"
      - name: Show container logs
        if: failure()
        run: docker logs docskit-smoke
      - name: Remove test container
        if: always()
        run: docker rm --force docskit-smoke
