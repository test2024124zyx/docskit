name: Apply and verify review fixes

on:
  push:
    branches: [fix/review-20260920]

permissions:
  contents: read

jobs:
  repair:
    name: Verify review fixes on Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/review-20260920
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm regressions fail on original code
        shell: bash
        run: |
          set +e
          node --test test/review-regressions.test.js > "$RUNNER_TEMP/review-baseline.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/review-baseline.log"
          test "$status" -ne 0
      - name: Apply source-verified fixes
        run: python3 _review/apply.py
      - name: Build validation
        run: npm run build
      - name: Full test suite with regressions
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified source changes to repair branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-assets.js server.js markdown.js script.js static-build.js
          git commit -m 'fix: correct download cleanup, Markdown rendering and static build edge cases'
          git push origin HEAD:refs/heads/fix/review-20260920
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
