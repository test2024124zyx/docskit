name: Verify dependency security fixes

on:
  push:
    branches: [fix/review-20260920]

permissions:
  contents: read

jobs:
  repair:
    name: Verify compatible security updates on Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/review-20260920
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Update affected packages within existing version ranges
        run: |
          npm update mermaid dompurify --ignore-scripts
          git diff --exit-code -- package.json
          npm ls mermaid dompurify
      - name: Validate reproducible installation
        run: npm ci
      - name: Build validation
        run: npm run build
      - name: Full test suite with regressions
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit verified dependency lockfile to repair branch
        run: |
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): update Mermaid and DOMPurify security patches'
          git push origin HEAD:refs/heads/fix/review-20260920
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
